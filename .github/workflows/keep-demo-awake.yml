name: keep demo awake

on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install playwright
      - name: Install Chromium (retry on flaky apt mirrors)
        run: |
          for i in 1 2 3; do
            playwright install --with-deps --only-shell chromium && exit 0
            echo "install attempt $i failed, retrying in 20s"; sleep 20
          done
          echo "apt mirrors unreachable, installing Chromium without system deps"
          playwright install --only-shell chromium
      - run: python scripts/wake_demo.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wake-debug
          path: wake-debug.png
          if-no-files-found: ignore
