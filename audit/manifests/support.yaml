# Audit scaffolding (synthetic, not from the model): namespaces, the nginx ConfigMap the b03 case
# references, and the pod-janitor ServiceAccount + RBAC implied by the b05 case.
apiVersion: v1
kind: Namespace
metadata: {name: web}
---
apiVersion: v1
kind: Namespace
metadata: {name: ops}
---
apiVersion: v1
kind: Namespace
metadata: {name: seed}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: edge-proxy-conf, namespace: web}
data:
  default.conf: |
    server {
      listen 8080;
      location / { return 200 "AUDIT_OK\n"; }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: pod-janitor, namespace: ops}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: pod-janitor}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: pod-janitor}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: pod-janitor}
subjects:
  - {kind: ServiceAccount, name: pod-janitor, namespace: ops}
