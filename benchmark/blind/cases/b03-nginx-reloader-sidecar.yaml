# BLIND CASE b03: nginx with a config-reloader sidecar that signals nginx (SIGHUP).
# MUST KEEP WORKING:
#  - shareProcessNamespace: true (the sidecar finds the nginx master PID)
#  - both containers "nginx" and "config-reloader" exist with unchanged command/args
#  - the sidecar can signal nginx: both run as the same effective UID, or the sidecar keeps CAP KILL
#  - volume "conf" mounted in both containers at /etc/nginx/conf.d
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-proxy
  namespace: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-proxy
  template:
    metadata:
      labels:
        app: edge-proxy
    spec:
      shareProcessNamespace: true
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.25.4
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
        - name: config-reloader
          image: registry.example.com/conf-reloader:2.1.0
          command: ["/bin/reloader"]
          args: ["--watch=/etc/nginx/conf.d", "--signal=HUP", "--process=nginx: master"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          securityContext:
            allowPrivilegeEscalation: true
      volumes:
        - name: conf
          configMap:
            name: edge-proxy-conf
