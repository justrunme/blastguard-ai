# CASE 02 (function-critical): node metrics agent. It must report the NODE's network stack and listen on the node IP.
# MUST KEEP WORKING: hostNetwork: true, containerPort 9100, args unchanged.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.2
          args: ["--web.listen-address=:9100", "--collector.netdev"]
          ports:
            - containerPort: 9100
              hostPort: 9100
          resources:
            limits: {cpu: 250m, memory: 180Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
