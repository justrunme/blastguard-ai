# CASE 08 (fixable): API server that never calls the Kubernetes API; only the SA token automount is the problem.
# MUST KEEP WORKING: container 'api' port 8080, env unchanged, readinessProbe unchanged, writable /tmp, replicas 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/billing-api:3.0.4
          env:
            - name: LOG_LEVEL
              value: info
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
