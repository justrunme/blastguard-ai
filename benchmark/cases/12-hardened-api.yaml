# CASE 12 (already hardened): fully hardened API with NetworkPolicy. No blocking findings expected.
# MUST KEEP WORKING: everything unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-api
  namespace: users
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-api
  template:
    metadata:
      labels:
        app: profile-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/example/profile-api:4.1.0
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: profile-api
  namespace: users
spec:
  podSelector:
    matchLabels:
      app: profile-api
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
