# API deployment: floating image tag, runs as root, unbounded resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: nginx:latest
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 0
